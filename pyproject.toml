[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "zerocopy-infer"
version = "0.1.0"
description = "Zero-Disk Cloud-Native MoE & LLM Streaming Inference Engine via Hugging Face HTTP Range Requests"
readme = "README.md"
authors = [
    { name = "Leandro Emanuel Timberini", email = "leaatimberini@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "numpy>=1.22.0",
    "tqdm>=4.64.0",
]

[project.urls]
Homepage = "https://github.com/leaatimberini/zerocopy-infer"
Repository = "https://github.com/leaatimberini/zerocopy-infer.git"

[project.scripts]
zerocopy-infer = "zerocopy_infer.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
