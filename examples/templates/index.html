<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ZeroCopy-Infer - Mobile AI Playground</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..900&amp;family=Inter:wght@400..700&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<style>
    body {
        background-color: #131315;
        color: #e5e1e4;
        font-family: 'Inter', sans-serif;
    }
    .glass-panel {
        background-color: rgba(22, 22, 24, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .ai-bubble {
        background: linear-gradient(135deg, rgba(75, 0, 126, 0.25) 0%, rgba(134, 66, 192, 0.15) 100%);
        border: 1px solid rgba(134, 66, 192, 0.35);
        border-top: 2px solid rgba(241, 218, 255, 0.5);
    }
    .user-bubble {
        background-color: rgba(42, 42, 44, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .neon-text {
        color: #c3f400;
    }
</style>
</head>
<body class="antialiased min-h-screen flex flex-col justify-between">
    <!-- Header -->
    <header class="fixed top-0 w-full z-50 glass-panel flex items-center justify-between px-4 h-14 border-b border-white/10">
        <div class="flex items-center gap-2">
            <span class="material-symbols-outlined neon-text">bolt</span>
            <h1 class="font-bold text-lg text-white font-['Geist']">ZeroCopy-Infer</h1>
            <span class="text-xs bg-lime-400/20 text-lime-400 font-mono px-2 py-0.5 rounded border border-lime-400/30">Zero-Disk</span>
        </div>
        <div class="flex items-center gap-2">
            <select id="modelSelect" onchange="updateSettings()" class="bg-black/60 text-xs font-mono text-lime-300 border border-white/20 rounded px-2 py-1 focus:outline-none">
                <option value="google/gemma-4-26B-A4B-it">Google Gemma 4 26B (MoE)</option>
                <option value="google/gemma-4-31B-it">Google Gemma 4 31B (Dense)</option>
                <option value="moonshotai/Kimi-K3">Moonshot Kimi K3 (2.78T)</option>
                <option value="XiaomiMiMo/MiMo-V2.5-Pro">Xiaomi MiMo V2.5 Pro</option>
                <option value="deepseek-ai/DeepSeek-V3">DeepSeek V3 (MLA)</option>
                <option value="Qwen/Qwen2.5-1.5B-Instruct">Qwen 2.5 1.5B (Fast)</option>
            </select>
        </div>
    </header>

    <!-- Telemetry Card -->
    <div class="mt-16 px-4">
        <div class="glass-panel rounded-xl p-3 flex justify-between items-center text-xs font-mono border border-white/10 shadow-lg">
            <div>
                <span class="text-gray-400 block">THROUGHPUT</span>
                <span id="statTps" class="text-lime-400 font-bold text-sm">-- t/s</span>
            </div>
            <div class="border-r border-white/10 h-8"></div>
            <div>
                <span class="text-gray-400 block">LATENCY</span>
                <span id="statLat" class="text-blue-400 font-bold text-sm">-- ms/t</span>
            </div>
            <div class="border-r border-white/10 h-8"></div>
            <div>
                <span class="text-gray-400 block">STREAMED</span>
                <span id="statStreamed" class="text-purple-400 font-bold text-sm">0.0 MB</span>
            </div>
        </div>
    </div>

    <!-- Chat Messages Thread -->
    <main id="chatThread" class="flex-1 overflow-y-auto px-4 py-4 space-y-4 my-2">
        <div class="ai-bubble p-4 rounded-xl max-w-[85%] shadow-md">
            <div class="flex items-center gap-2 mb-1">
                <span class="material-symbols-outlined text-purple-400 text-sm">smart_toy</span>
                <span class="font-bold text-xs text-purple-300 font-mono">ZeroCopy Agent</span>
            </div>
            <p class="text-sm text-gray-200">🚀 Hola! Soy ZeroCopy-Infer rodando 100% Zero-Disk en RAM. ¿Qué modelo deseas probar hoy?</p>
        </div>
    </main>

    <!-- Controls & Input Bar -->
    <footer class="glass-panel p-4 border-t border-white/10 space-y-3">
        <!-- Controls Sliders -->
        <div class="grid grid-cols-2 gap-4 text-xs font-mono text-gray-300">
            <div>
                <div class="flex justify-between mb-1">
                    <span>Active Layers:</span>
                    <span id="layerVal" class="text-lime-400 font-bold">4</span>
                </div>
                <input id="layerSlider" type="range" min="1" max="64" value="4" oninput="document.getElementById('layerVal').innerText=this.value; updateSettings();" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-lime-400"/>
            </div>
            <div>
                <div class="flex justify-between mb-1">
                    <span>RAM Limit:</span>
                    <span id="ramVal" class="text-blue-400 font-bold">4.0 GB</span>
                </div>
                <input id="ramSlider" type="range" min="1" max="16" value="4" oninput="document.getElementById('ramVal').innerText=this.value+' GB'; updateSettings();" class="w-full h-1 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-400"/>
            </div>
        </div>

        <!-- Input Bar -->
        <div class="flex items-center gap-2">
            <input id="userPrompt" type="text" placeholder="Escribe tu mensaje..." onkeypress="if(event.key==='Enter') sendMessage()" class="flex-1 bg-black/50 border border-white/20 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-lime-400 font-mono"/>
            <button onclick="sendMessage()" class="bg-lime-400 hover:bg-lime-300 text-black font-bold p-2 rounded-xl flex items-center justify-center transition-all">
                <span class="material-symbols-outlined">send</span>
            </button>
        </div>
    </footer>

<script>
async function updateSettings() {
    const model = document.getElementById('modelSelect').value;
    const layers = parseInt(document.getElementById('layerSlider').value);
    const ram = parseFloat(document.getElementById('ramSlider').value);
    await fetch('/api/settings', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({model, layers, ram})
    });
}

async function sendMessage() {
    const input = document.getElementById('userPrompt');
    const text = input.value.trim();
    if(!text) return;
    
    input.value = '';
    const chat = document.getElementById('chatThread');
    
    // Append User Message
    const userDiv = document.createElement('div');
    userDiv.className = 'user-bubble p-4 rounded-xl max-w-[85%] ml-auto shadow-md';
    userDiv.innerHTML = `<div class="text-xs text-gray-400 font-mono mb-1">[Tú]</div><p class="text-sm text-white">${text}</p>`;
    chat.appendChild(userDiv);
    chat.scrollTop = chat.scrollHeight;

    // Append AI Typing Bubble
    const aiDiv = document.createElement('div');
    aiDiv.className = 'ai-bubble p-4 rounded-xl max-w-[85%] shadow-md';
    aiDiv.innerHTML = `<div class="flex items-center gap-2 mb-1"><span class="material-symbols-outlined text-purple-400 text-sm">smart_toy</span><span class="font-bold text-xs text-purple-300 font-mono">ZeroCopy Agent</span></div><p id="currentAiResp" class="text-sm text-gray-200 animate-pulse">Pensando...</p>`;
    chat.appendChild(aiDiv);
    chat.scrollTop = chat.scrollHeight;

    const start = Date.now();
    const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({prompt: text})
    });
    const data = await res.json();
    const elapsed = (Date.now() - start) / 1000;
    
    document.getElementById('currentAiResp').classList.remove('animate-pulse');
    document.getElementById('currentAiResp').innerText = data.reply || 'Respuesta generada en Zero-Disk RAM.';
    
    document.getElementById('statTps').innerText = (10 / elapsed).toFixed(1) + ' t/s';
    document.getElementById('statLat').innerText = ((elapsed / 10) * 1000).toFixed(0) + ' ms/t';
    document.getElementById('statStreamed').innerText = (data.streamed_mb || 64.5).toFixed(1) + ' MB';
    chat.scrollTop = chat.scrollHeight;
}
</script>
</body>
</html>
